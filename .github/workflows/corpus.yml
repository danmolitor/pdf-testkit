name: Producer corpus

# The per-commit suite (corpus.regression.test.ts) runs extraction + diff over
# the COMMITTED fixtures on every push — fast, no rendering. This job is the
# other half: it actually renders every producer and checks the result against
# what's committed, so a producer version bump that changes extraction is a
# visible, reviewable failure instead of silent drift.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — catches upstream producer releases
  workflow_dispatch: {}
  pull_request:
    types: [labeled, synchronize] # runs when a PR carries the `run-corpus` label

jobs:
  regenerate:
    name: Render every producer and diff against committed
    # schedule/dispatch always; PRs only when labelled run-corpus.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-corpus')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # generate.ts is executed directly (`node …/generate.ts`), which needs
          # Node's native TypeScript type-stripping — unflagged only since Node
          # 22.18 / 23.6. Node 20 throws ERR_UNKNOWN_FILE_EXTENSION on the .ts.
          # 24 also matches the local env the committed fixtures were rendered on.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pin the browser Puppeteer renders with. The runner's PREINSTALLED Chrome
      # floats with the GitHub image, and every Chrome build nudges text a
      # fraction of a point — which flips Puppeteer's structureHash with no real
      # change, the corpus's last false-positive source. Chrome for Testing is
      # immutable per version, so pinning it makes Puppeteer output reproducible
      # run-to-run. Bump CHROME_VERSION deliberately to adopt (and re-pin) a new
      # Chrome; the producer prefers $CHROME_PATH over the runner's copy.
      - name: Install pinned Chrome for Testing
        env:
          CHROME_VERSION: 154.0.8037.57
        run: |
          out=$(npx --yes @puppeteer/browsers install "chrome@${CHROME_VERSION}" --path "$RUNNER_TEMP/cft")
          echo "$out"
          bin=$(echo "$out" | awk 'END{print $NF}')
          test -x "$bin" || { echo "::error::pinned Chrome not found at '$bin'"; exit 1; }
          echo "CHROME_PATH=$bin" >> "$GITHUB_ENV"
      # Pull the rendering producers to their latest published versions so a new
      # release is caught here. npm ci alone installs the locked versions and
      # would never surface an upstream bump. (Puppeteer's browser is pinned
      # above; puppeteer-core@latest still catches API/output changes in the lib.)
      - name: Update producers to latest
        run: npm install -w @pdf-testkit/fixtures @react-pdf/renderer@latest pdfkit@latest puppeteer-core@latest @formepdf/core@latest @formepdf/react@latest
      - name: Regenerate the corpus
        run: node packages/fixtures/producers/generate.ts
      # Gate on STRUCTURE, not version. The manifest records each fixture's
      # structureHash/layoutHash (what pdf-testkit extracts) plus the producer
      # version. Only a change to the extracted structure is a real signal — a
      # producer cutting a release that renders identically is a non-event for
      # this tool, and gating on the version field alone turned every upstream
      # release into a red weekly build (three in two weeks: forme 0.23→0.25,
      # puppeteer 25.11→25.12, all with zero structural change). So compare only
      # the hash fields; surface a version bump as a notice, never a failure.
      # PDF bytes (embedded dates) are not gated either.
      - name: Fail on structural drift (producer version bumps alone don't fail)
        run: |
          proj() { jq -S '[.[] | {file, structureHash, layoutHash}]' "$1"; }
          git show HEAD:packages/fixtures/corpus-manifest.json > /tmp/committed-manifest.json
          if ! diff <(proj /tmp/committed-manifest.json) <(proj packages/fixtures/corpus-manifest.json); then
            echo "::error::Corpus STRUCTURE drift — a producer changed the extracted structure of a fixture (structureHash/layoutHash differ above). This is the signal the corpus exists to catch. Regenerate locally ('node packages/fixtures/producers/generate.ts'), review the change, and commit the fixtures + manifest."
            exit 1
          fi
          if ! git diff --quiet -- packages/fixtures/corpus-manifest.json; then
            echo "::notice::Producer version(s) moved but the extracted structure is unchanged — re-pin the manifest at your convenience. Not a failure."
          fi
          echo "No structural drift."
      - name: Upload regenerated corpus for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-corpus
          path: |
            packages/fixtures/pdfs/
            packages/fixtures/corpus-manifest.json
